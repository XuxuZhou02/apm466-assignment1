[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yieldcurve"
version = "1.0.0"
description = "Government of Canada bond yield, spot and forward curve construction with PCA of rate dynamics"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Xuxu Zhou" }]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "python-dateutil>=2.8",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
yieldcurve = "yieldcurve.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
